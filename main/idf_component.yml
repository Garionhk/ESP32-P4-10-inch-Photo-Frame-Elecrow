dependencies:
  idf:
    version: ">=5.5.0"
  espressif/esp_lcd_ek79007:
    version: "^1.0.2"
  espressif/esp_new_jpeg:
    version: "^1.0.0"
  lvgl/lvgl:
    version: "~9.3.0"
  # PINNED. esp_hosted must match the MAJOR version of the firmware on the
  # CrowPanel's C6, which ships 2.12.3. A 3.x host links up over SDIO but its
  # RPC bring-up times out against a 2.x C6, and 3.1.0 additionally aborts the
  # firmware when it cannot preallocate 30 KB of internal DMA RAM. Moving to 3.x
  # means reflashing the C6 first. The sdkconfig symbol names differ between
  # 2.x and 3.x (3.x adds a HOST_ infix) -- see sdkconfig.defaults.
  espressif/esp_wifi_remote:
    version: "==1.6.4"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_hosted:
    version: "==2.12.3"
    rules:
      - if: "target in [esp32p4]"
  espressif/esp_lcd_touch:
    version: "^1.1.0"
  espressif/esp_lcd_touch_gt911:
    version: "^1.1.3"
